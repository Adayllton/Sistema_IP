{% extends "base.html" %}
{% load static %}
{% block title %}Login - Sistema Importados{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-box">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        {{ form.username.label_tag }}
        {{ form.username }}
      </div>
      <div class="form-group">
        {{ form.password.label_tag }}
        {{ form.password }}
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>
    <p>Não possui uma conta? <a href="{% url 'users:cadastro' %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
